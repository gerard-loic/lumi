<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Extranet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --border:    #2a2a2a;
      --accent:    #00e5a0;
      --accent-dim:#00e5a020;
      --text:      #e8e8e8;
      --muted:     #666;
      --user-bg:   #1e2a24;
      --bot-bg:    #1a1a1a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .model-badge {
      margin-left: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Message bubble ── */
    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user  { align-items: flex-end; }
    .message.bot   { align-items: flex-start; }

    .role {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 4px;
    }
    .message.user .role { color: var(--accent); opacity: 0.7; }

    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.6;
      font-weight: 300;
      border: 1px solid transparent;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border-color: #00e5a030;
      font-weight: 400;
    }

    .message.bot .bubble {
      background: var(--bot-bg);
      border-color: var(--border);
    }

    /* ── Tool call indicator ── */
    .tool-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid #00e5a040;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 4px;
      align-self: flex-start;
    }
    .tool-indicator::before {
      content: '⚙';
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .tool-indicator.done::before {
      content: '✓';
      animation: none;
    }
    .tool-indicator.error::before {
      content: '✗';
      animation: none;
    }
    .tool-indicator.error {
      color: #ff6b6b;
      background: #ff4d4d10;
      border-color: #ff4d4d40;
    }

    /* ── Resource attachment (file / url) ── */
    .resource-attachment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 4px;
      text-decoration: none;
      margin-top: 6px;
      max-width: 85%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      align-self: flex-start;
      transition: border-color 0.2s, color 0.2s;
    }
    .resource-attachment:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .resource-attachment.type-file::before { content: '⊟  '; opacity: 0.6; }
    .resource-attachment.type-url::before  { content: '↗  '; opacity: 0.6; }
    .resource-attachment.type-rag::before  { content: '▤  '; opacity: 0.6; }
    .resource-attachment.mine { align-self: flex-end; }

    /* Citation de source sans fichier accessible (span, non cliquable, informative) : visuellement
       distincte des ressources actionnables (fichier généré / url). */
    .resource-attachment.type-rag {
      color: var(--muted);
      border-style: dashed;
      cursor: default;
    }
    .resource-attachment.type-rag:hover {
      border-color: var(--border);
      color: var(--muted);
    }
    /* Citation avec fichier source accessible (rendue en <a> par addRagSource) : redevient actionnable */
    a.resource-attachment.type-rag {
      color: var(--text);
      border-style: solid;
      cursor: pointer;
    }
    a.resource-attachment.type-rag:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Pièces jointes en cours de rédaction (avant envoi) ── */
    .staged-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .staged-attachments:empty { display: none; }

    .staged-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 8px 5px 10px;
      border-radius: 4px;
      max-width: 220px;
    }
    .staged-chip::before { content: '⊟  '; opacity: 0.6; }
    .staged-chip.uploading { opacity: 0.6; border-style: dashed; }
    .staged-chip.error { border-color: #ff4d4d60; color: #ff6b6b; }
    .staged-chip .chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .staged-chip .chip-remove {
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
      padding: 0 2px;
      line-height: 1;
    }
    .staged-chip .chip-remove:hover { color: #ff6b6b; }

    /* ── Cursor clignotant pendant stream ── */
    .cursor {
      display: inline-block;
      width: 7px; height: 14px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Input zone ── */
    .input-zone {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-weight: 300;
      padding: 12px 14px;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s;
      overflow-y: auto;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: #00e5a050; }

    button#send {
      width: 46px; height: 46px;
      flex-shrink: 0;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
      color: #000;
    }
    button#send:hover  { opacity: 0.85; }
    button#send:active { transform: scale(0.95); }
    button#send:disabled { opacity: 0.3; cursor: not-allowed; }
    button#send svg { width: 18px; height: 18px; }

    button#attach {
      width: 46px; height: 46px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, transform 0.1s;
      color: var(--text);
    }
    button#attach:hover:not(:disabled)  { border-color: var(--accent); color: var(--accent); }
    button#attach:active:not(:disabled) { transform: scale(0.95); }
    button#attach:disabled { opacity: 0.3; cursor: not-allowed; }
    button#attach svg { width: 18px; height: 18px; }

    /* ── Hint raccourci ── */
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── Auth modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px 32px;
      width: 480px;
      max-width: calc(100vw - 40px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-header h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .modal-server-row {
      display: flex;
      gap: 10px;
    }
    .modal-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .modal-field.host { flex: 2; }
    .modal-field label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-field input:focus { border-color: #00e5a050; }

    .modal textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 12px 14px;
      resize: vertical;
      min-height: 120px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    .modal textarea:focus { border-color: #00e5a050; }

    .modal-error {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #ff6b6b;
      min-height: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover    { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Confirmation card ── */
    .confirmation-card {
      background: var(--surface);
      border: 1px solid #00e5a040;
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 85%;
      margin-bottom: 4px;
      align-self: flex-start;
      animation: fadeIn 0.2s ease;
    }

    .confirmation-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .confirmation-question {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }

    .confirmation-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .confirmation-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .confirmation-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .confirmation-btn.selected {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .confirmation-btn:disabled:not(.selected) {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }
    .empty-state .icon {
      font-size: 36px;
      opacity: 0.3;
    }
    .empty-state p {
      font-size: 13px;
      line-height: 1.6;
    }
    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      text-align: left;
      transition: border-color 0.2s, color 0.2s;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .suggestion:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .followup-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .followup-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.2s, color 0.2s;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .followup-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

<!-- ── Auth modal ── -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <div class="modal-header">
      <div class="dot"></div>
      <h2>Authentification</h2>
    </div>
    <p class="modal-desc">Renseignez l'adresse du serveur puis le body de connexion en JSON :</p>
    <div class="modal-server-row">
      <div class="modal-field host">
        <label for="serverHost">Hôte</label>
        <input type="text" id="serverHost" value="127.0.0.1" spellcheck="false" placeholder="127.0.0.1" />
      </div>
      <div class="modal-field">
        <label for="serverPort">Port</label>
        <input type="text" id="serverPort" value="8001" spellcheck="false" placeholder="8001" />
      </div>
    </div>
    <textarea id="authBody" spellcheck="false">{
  "authorization": {
    "token": ""
  },
  "profile": "default",
  "language" : "fr"
}</textarea>
    <div class="modal-error" id="authError"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="authBtn" onclick="authenticate()">Se connecter</button>
    </div>
  </div>
</div>

<div class="app">

  <header>
    <div class="dot"></div>
    <h1>Extranet — Assistant</h1>
    <span class="model-badge" id="modelBadge">llama3.1:8b</span>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">⬡</div>
      <p>Posez une question sur vos commandes ou vos produits.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="fillSuggestion(this)">Où en est ma commande 4521 ?</button>
        <button class="suggestion" onclick="fillSuggestion(this)">Quel est le prix du produit REF-002 ?</button>
        <button class="suggestion" onclick="fillSuggestion(this)">Est-ce que le REF-003 est en stock ?</button>
      </div>
    </div>
  </div>

  <div class="input-zone">
    <div class="staged-attachments" id="stagedAttachments"></div>
    <div class="input-row">
      <input
        type="file"
        id="attachInput"
        multiple
        hidden
        accept=".pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.md,.html,.htm,.py,.js,.ts,.txt,.csv"
      />
      <button id="attach" type="button" onclick="attachInput.click()" title="Joindre un fichier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3 3 0 014.24 4.24l-9.19 9.19a1 1 0 01-1.41-1.41l8.48-8.49"></path>
        </svg>
      </button>
      <textarea
        id="input"
        placeholder="Posez votre question…"
        rows="1"
        autofocus
      ></textarea>
      <button id="send" onclick="sendMessage()" title="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="hint">Entrée pour envoyer · Maj+Entrée pour un saut de ligne · 📎 pour joindre un fichier</div>
  </div>

</div>

<script>
  // ── Config ──────────────────────────────────────────────────────
  // Construites à partir des champs hôte/port de la modale (valeurs par défaut : 127.0.0.1:8001)
  let BASE_URL, WS_URL, AUTH_URL, UPLOAD_URL;

  function buildUrls() {
    let host = (document.getElementById("serverHost").value || "127.0.0.1").trim();
    const port = (document.getElementById("serverPort").value || "8001").trim();

    let scheme = "http";
    if (host.includes("://")) {
      const idx = host.indexOf("://");
      scheme = host.slice(0, idx);
      host = host.slice(idx + 3);
    }
    host = host.replace(/\/+$/, "");
    const wsScheme = scheme === "https" ? "wss" : "ws";

    BASE_URL   = `${scheme}://${host}:${port}`;
    WS_URL     = `${wsScheme}://${host}:${port}/ws`;
    AUTH_URL   = BASE_URL + "/auth";
    UPLOAD_URL = BASE_URL + "/files/upload";
  }
  buildUrls();

  let authToken  = null;
  let ws         = null;
  let isStreaming = false;
  let currentCtx  = null;

  // ── Pièces jointes en cours de rédaction (avant envoi) ───────────
  let stagedAttachments = []; // { id, key, filename, tokens, status: 'uploading'|'ready'|'error', chipEl }
  let pendingUploads    = 0;

  // ── Éléments DOM ────────────────────────────────────────────────
  const messagesEl   = document.getElementById("messages");
  const inputEl      = document.getElementById("input");
  const sendBtn      = document.getElementById("send");
  const attachBtn    = document.getElementById("attach");
  const attachInput  = document.getElementById("attachInput");
  const stagedEl     = document.getElementById("stagedAttachments");
  const emptyState   = document.getElementById("emptyState");
  const authModal    = document.getElementById("authModal");
  const authBodyEl   = document.getElementById("authBody");
  const authErrorEl  = document.getElementById("authError");
  const authBtn      = document.getElementById("authBtn");

  sendBtn.disabled   = true;
  attachBtn.disabled = true;

  // ── Disponibilité du bouton d'envoi (stream en cours / upload en cours / non authentifié) ──
  function refreshSendAvailability() {
    sendBtn.disabled = isStreaming || !authToken || pendingUploads > 0;
  }

  // ── Authentification ─────────────────────────────────────────────
  async function authenticate() {
    authErrorEl.textContent = "";
    authBtn.disabled = true;
    buildUrls();

    let body;
    try {
      body = JSON.parse(authBodyEl.value);
    } catch {
      authErrorEl.textContent = "JSON invalide.";
      authBtn.disabled = false;
      return;
    }

    try {
      const resp = await fetch(AUTH_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!resp.ok) {
        const detail = await resp.json().catch(() => ({}));
        authErrorEl.textContent = detail.detail || `Erreur ${resp.status}`;
        authBtn.disabled = false;
        return;
      }

      const data = await resp.json();
      authToken = data.token;
      authModal.classList.add("hidden");
      inputEl.focus();
      connectWebSocket(); // connexion établie une fois pour toute la session
    } catch (err) {
      authErrorEl.textContent = `Erreur réseau : ${err.message}`;
      authBtn.disabled = false;
    }
  }

  // Soumettre la modale avec Ctrl+Entrée
  authBodyEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.ctrlKey) {
      e.preventDefault();
      authenticate();
    }
  });

  // ── WebSocket ────────────────────────────────────────────────────
  function connectWebSocket(onOpen = null) {
    // Déjà ouverte
    if (ws && ws.readyState === WebSocket.OPEN) {
      onOpen?.();
      return;
    }

    // Connexion en cours — empiler le callback
    if (ws && ws.readyState === WebSocket.CONNECTING) {
      const prev = ws._pendingOpen;
      ws._pendingOpen = () => { prev?.(); onOpen?.(); };
      return;
    }

    ws = new WebSocket(`${WS_URL}?token=${encodeURIComponent(authToken)}`);
    ws._pendingOpen = onOpen;

    ws.onopen = () => {
      attachBtn.disabled = false;
      refreshSendAvailability();
      ws._pendingOpen?.();
      ws._pendingOpen = null;
    };

    ws.onmessage = handleWsMessage;

    ws.onclose = (event) => {
      ws = null;

      // Token invalide ou session expirée → retour à la modale
      if (event.code === 4001 || event.code === 4003) {
        authToken = null;
        sendBtn.disabled = true;
        attachBtn.disabled = true;
        clearStagedAttachments(); // les clés étaient rattachées à la session qui vient d'expirer
        authBtn.disabled = false;
        authModal.classList.remove("hidden");
        if (isStreaming && currentCtx) {
          currentCtx.cursor.remove();
          endStream();
        }
        return;
      }

      // Session déjà ouverte dans un autre onglet
      if (event.code === 4409) {
        sendBtn.disabled = true;
        attachBtn.disabled = true;
        appendSystemMessage("Session déjà active dans un autre onglet. Fermez-le et actualisez.");
        if (isStreaming && currentCtx) {
          currentCtx.cursor.remove();
          endStream();
        }
        return;
      }

      // Timeout d'inactivité (1001) ou perte réseau → ws = null, on reconnectera au prochain envoi
      if (isStreaming && currentCtx) {
        currentCtx.cursor.remove();
        currentCtx.textNode.textContent += "\n[Connexion interrompue]";
        endStream();
      }
    };

    ws.onerror = () => { /* onclose sera appelé juste après */ };
  }

  // ── Gestion des messages entrants ────────────────────────────────
  function handleWsMessage(event) {
    if (!currentCtx) return;
    const { bubble, textNode, cursor, msg, toolIndicators } = currentCtx;

    let data;
    try { data = JSON.parse(event.data); } catch { return; }

    if (data.type === "token") {
      textNode.textContent += data.content;
      scrollBottom();

    } else if (data.type === "tool_call") {
      if (data.status === "PENDING") {
        const el = addToolIndicator(msg, bubble, data.message || data.tool_name);
        toolIndicators.set(data.call_uid, el);
      } else if (data.status === "OK") {
        const el = toolIndicators.get(data.call_uid);
        if (el) el.classList.add("done");
      } else if (data.status === "ERROR") {
        const el = toolIndicators.get(data.call_uid);
        if (el) el.classList.add("error");
      }
      scrollBottom();

    } else if (data.type === "confirmation") {
      addConfirmationCard(msg, bubble, data.question, data.options);

    } else if (data.type === "confirmation_refused") {
      const el = document.createElement("div");
      el.className = "tool-indicator error";
      el.textContent = " Action annulée";
      msg.insertBefore(el, bubble);
      scrollBottom();

    } else if (data.type === "file" || data.type === "url") {
      addResource(msg, data);
      scrollBottom();

    } else if (data.type === "rag") {
      addRagSource(msg, data);
      scrollBottom();

    } else if (data.type === "followup") {
      addFollowUpChips(msg, data.questions);
      scrollBottom();

    } else if (data.type === "error") {
      cursor.remove();
      if (!textNode.textContent) {
        textNode.textContent = data.message || "Une erreur est survenue.";
        bubble.style.borderColor = "#ff4d4d40";
        bubble.style.color = "#ff6b6b";
      }
      scrollBottom();
      endStream();

    } else if (data.type === "end") {
      cursor.remove();
      endStream();
    }
  }

  function endStream() {
    isStreaming = false;
    currentCtx = null;
    refreshSendAvailability();
    inputEl.focus();
    // La connexion WS reste ouverte
  }

  // ── Auto-resize textarea ─────────────────────────────────────────
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  // ── Entrée pour envoyer, Maj+Entrée pour saut de ligne ──────────
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Suggestions ──────────────────────────────────────────────────
  function fillSuggestion(btn) {
    inputEl.value = btn.textContent.trim();
    inputEl.focus();
  }

  // ── Ajouter un message utilisateur (+ pièces jointes déjà uploadées) ──
  function addUserMessage(text, attachments = []) {
    const empty = document.getElementById("emptyState");
    if (empty) empty.remove();

    const msg = document.createElement("div");
    msg.className = "message user";
    msg.innerHTML = `
      <div class="role">Vous</div>
      ${text ? `<div class="bubble">${escapeHtml(text)}</div>` : ""}
    `;
    messagesEl.appendChild(msg);
    attachments.forEach(a => addSentAttachment(msg, a.filename, a.key));
    scrollBottom();
  }

  // ── Ajouter la chip d'une pièce jointe déjà envoyée (téléchargeable) ──
  function addSentAttachment(msg, filename, key) {
    const url = `${BASE_URL}/files/${key}/${encodeURIComponent(filename)}`;
    const el = document.createElement("a");
    el.className = "resource-attachment type-file mine";
    el.href = "#";
    el.textContent = escapeHtml(filename);
    el.addEventListener("click", (e) => {
      e.preventDefault();
      downloadViaAuth(url, filename);
    });
    msg.appendChild(el);
    return el;
  }

  // ── Créer un message bot vide (retourner refs pour le remplir) ───
  function addBotMessage() {
    const msg = document.createElement("div");
    msg.className = "message bot";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const textNode = document.createTextNode("");
    const cursor   = document.createElement("span");
    cursor.className = "cursor";

    bubble.appendChild(textNode);
    bubble.appendChild(cursor);
    msg.innerHTML = '<div class="role">Assistant</div>';
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();

    return { bubble, textNode, cursor, msg };
  }

  // ── Ajouter un indicateur d'outil ────────────────────────────────
  function addToolIndicator(msg, bubble, toolName) {
    const el = document.createElement("div");
    el.className = "tool-indicator";
    el.textContent = ` Appel : ${toolName}`;
    msg.insertBefore(el, bubble);
    return el;
  }

  // ── Ajouter une carte de confirmation ────────────────────────────
  function addConfirmationCard(msg, bubble, question, options) {
    const card = document.createElement("div");
    card.className = "confirmation-card";

    const label = document.createElement("div");
    label.className = "confirmation-label";
    label.textContent = "⚠ Confirmation requise";

    const q = document.createElement("div");
    q.className = "confirmation-question";
    q.textContent = question || "Voulez-vous continuer ?";

    const btns = document.createElement("div");
    btns.className = "confirmation-options";

    (options || []).forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "confirmation-btn";
      btn.textContent = opt;
      btn.onclick = () => {
        btns.querySelectorAll("button").forEach((b, i) => {
          b.disabled = true;
          if (i === idx) b.classList.add("selected");
        });
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "confirmation", option: idx }));
        }
      };
      btns.appendChild(btn);
    });

    card.appendChild(label);
    card.appendChild(q);
    card.appendChild(btns);
    msg.insertBefore(card, bubble);
    scrollBottom();
    return card;
  }

  // ── Téléchargement authentifié d'un fichier (Bearer) ─────────────
  async function downloadViaAuth(url, filename) {
    try {
      const resp = await fetch(url, {
        headers: { "Authorization": "Bearer " + authToken }
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = filename || "fichier";
      a.click();
      URL.revokeObjectURL(blobUrl);
    } catch (err) {
      console.error("Téléchargement échoué :", err);
    }
  }

  // ── Ajouter une ressource jointe (file / url) ────────────────────
  function addResource(msg, event) {
    const isFile = event.type === "file";
    const el = document.createElement(event.url ? "a" : "span");
    el.className = "resource-attachment " + (isFile ? "type-file" : "type-url");
    if (event.url) {
      if (isFile) {
        el.href = "#";
        el.addEventListener("click", (e) => {
          e.preventDefault();
          downloadViaAuth(event.url, event.name);
        });
      } else {
        el.href = event.url;
        el.target = "_blank";
        el.rel = "noopener noreferrer";
      }
    }
    el.textContent = escapeHtml(event.name || event.path || event.url || "Ressource");
    msg.appendChild(el);
    return el;
  }

  // ── Ajouter la citation d'une source utilisée (RAG persistant ou fichiers joints) ──
  function addRagSource(msg, event) {
    const el = document.createElement(event.url ? "a" : "span");
    el.className = "resource-attachment type-rag";
    const label = event.locations && event.locations.length
      ? `${event.source} — p. ${event.locations.join(", ")}`
      : event.source;
    el.textContent = escapeHtml(label || "Source");
    if (event.url) {
      //Navigation directe (URL déjà signée côté serveur via ?t=) plutôt qu'un fetch authentifié :
      //évite le préflight CORS, peu fiable depuis un fichier local via un tunnel.
      el.href = event.url;
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    }
    msg.appendChild(el);
    return el;
  }

  // ── Ajouter des chips de questions de suivi ──────────────────────
  function addFollowUpChips(msg, questions) {
    if (!Array.isArray(questions) || !questions.length) return;

    const container = document.createElement("div");
    container.className = "followup-chips";

    questions.forEach((question) => {
      const btn = document.createElement("button");
      btn.className = "followup-chip";
      btn.textContent = question;
      btn.onclick = () => fillSuggestion(btn);
      container.appendChild(btn);
    });

    msg.appendChild(container);
    return container;
  }

  // ── Message système (info / erreur non liée à un échange) ────────
  function appendSystemMessage(text) {
    const msg = document.createElement("div");
    msg.className = "message bot";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.style.cssText = "color:var(--muted);font-style:italic;border-color:transparent";
    bubble.textContent = text;
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  // ── Sélection de fichiers à joindre ───────────────────────────────
  attachInput.addEventListener("change", () => {
    const files = Array.from(attachInput.files);
    attachInput.value = ""; // permet de resélectionner le même fichier ensuite
    files.forEach(uploadAttachment);
  });

  // ── Upload d'une pièce jointe vers /files/upload ─────────────────
  async function uploadAttachment(file) {
    const item = { id: crypto.randomUUID(), key: null, filename: file.name, tokens: null, status: "uploading" };
    stagedAttachments.push(item);
    item.chipEl = renderStagedChip(item);

    pendingUploads++;
    refreshSendAvailability();

    try {
      const form = new FormData();
      form.append("file", file);
      const resp = await fetch(UPLOAD_URL, {
        method: "POST",
        headers: { "Authorization": "Bearer " + authToken },
        body: form,
      });

      // La pièce jointe a pu être retirée par l'utilisateur pendant l'upload
      if (!stagedAttachments.includes(item)) return;

      if (!resp.ok) {
        const detail = await resp.json().catch(() => ({}));
        throw new Error(detail.detail || `Erreur ${resp.status}`);
      }

      const data = await resp.json();
      item.key = data.key;
      item.tokens = data.tokens;
      item.status = "ready";
      updateStagedChip(item);
    } catch (err) {
      if (!stagedAttachments.includes(item)) return;
      item.status = "error";
      item.error = err.message;
      updateStagedChip(item);
    } finally {
      pendingUploads--;
      refreshSendAvailability();
    }
  }

  // ── Rendu / mise à jour des chips de pièces jointes en attente ───
  function renderStagedChip(item) {
    const chip = document.createElement("div");
    chip.className = "staged-chip";
    const name = document.createElement("span");
    name.className = "chip-name";
    name.textContent = item.filename;
    const remove = document.createElement("span");
    remove.className = "chip-remove";
    remove.textContent = "×";
    remove.title = "Retirer";
    remove.onclick = () => removeStagedAttachment(item.id);
    chip.appendChild(name);
    chip.appendChild(remove);
    stagedEl.appendChild(chip);
    updateStagedChip(item, chip);
    return chip;
  }

  function updateStagedChip(item, chip = item.chipEl) {
    if (!chip) return;
    chip.classList.toggle("uploading", item.status === "uploading");
    chip.classList.toggle("error", item.status === "error");
    chip.title = item.status === "error"
      ? `${item.filename} — ${item.error}`
      : item.status === "ready"
        ? `${item.filename} (~${item.tokens} tokens)`
        : `${item.filename} — envoi en cours…`;
  }

  function removeStagedAttachment(id) {
    const idx = stagedAttachments.findIndex(a => a.id === id);
    if (idx === -1) return;
    stagedAttachments[idx].chipEl?.remove();
    stagedAttachments.splice(idx, 1);
  }

  function clearStagedAttachments() {
    stagedAttachments.forEach(a => a.chipEl?.remove());
    stagedAttachments = [];
  }

  // ── Envoi du message ─────────────────────────────────────────────
  function sendMessage() {
    const text = inputEl.value.trim();
    const readyAttachments = stagedAttachments.filter(a => a.status === "ready");
    if ((!text && readyAttachments.length === 0) || isStreaming || !authToken || pendingUploads > 0) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addUserMessage(text, readyAttachments);
    clearStagedAttachments();

    const refs = addBotMessage();
    currentCtx = { ...refs, toolIndicators: new Map() };
    isStreaming = true;

    // Les fichiers uploadés sont automatiquement consultables par l'agent (tool search_attached_files) :
    // pas besoin de les référencer dans le message, seul l'affichage (chip sous le message) en dépend.
    const doSend = () => ws.send(JSON.stringify({ type: "message", message: text }));

    if (ws && ws.readyState === WebSocket.OPEN) {
      doSend();
    } else {
      // WS fermée (timeout inactivité ou perte réseau) → reconnexion transparente
      connectWebSocket(doSend);
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
